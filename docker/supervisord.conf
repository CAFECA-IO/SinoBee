[supervisord]
nodaemon=true
logfile=/home/bee/.sinobee/logs/supervisord.log
pidfile=/tmp/supervisord.pid
childlogdir=/home/bee/.sinobee/logs

[program:xvfb]
command=Xvfb :99 -screen 0 %(ENV_SCREEN_GEOMETRY)s -ac -nolisten tcp
priority=10
autorestart=true

[program:fluxbox]
command=/bin/sh -c "sleep 1 && fluxbox"
priority=20
autorestart=true
environment=DISPLAY=":99"

[program:x11vnc]
command=/bin/sh -c "sleep 2 && exec x11vnc -display :99 -forever -shared -rfbport 5900 -localhost -quiet $( [ -f /home/bee/.sinobee/.vncpass ] && echo -rfbauth /home/bee/.sinobee/.vncpass || echo -nopw )"
priority=30
autorestart=true

[program:novnc]
command=websockify --web /usr/share/novnc 6080 localhost:5900
priority=40
autorestart=true

[program:sinobee]
command=/bin/sh -c "sleep 2 && exec sinobee serve --host 0.0.0.0 --port 10024"
directory=/home/bee/workspace
priority=50
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
environment=DISPLAY=":99"

[unix_http_server]
file=/tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock
